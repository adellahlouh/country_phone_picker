name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: What happened, and what did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Minimal code sample or steps that reproduce the problem.
      render: dart
    validations:
      required: true
  - type: input
    id: package-version
    attributes:
      label: Package version
      placeholder: e.g. 0.1.5
    validations:
      required: true
  - type: textarea
    id: flutter-doctor
    attributes:
      label: flutter doctor -v
      render: shell
  - type: input
    id: platform
    attributes:
      label: Platform
      placeholder: e.g. Android 14, iOS 18, Web (Chrome)
