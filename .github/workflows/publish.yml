name: Publish to pub.dev

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pub.dev
    permissions:
      id-token: write # pub.dev OIDC authentication
      contents: read
    steps:
      - uses: actions/checkout@v4

      # Sets up the OIDC token that pub.dev accepts for automated publishing.
      - uses: dart-lang/setup-dart@v1

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Check tag matches pubspec version
        run: |
          PUBSPEC_VERSION=$(grep -E '^version:' pubspec.yaml | awk '{print $2}')
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PUBSPEC_VERSION" != "$TAG_VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME does not match pubspec.yaml version $PUBSPEC_VERSION"
            exit 1
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Test
        run: flutter test

      - name: Publish
        run: flutter pub publish --force
